services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: cantera-hub-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_dev']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-dev-data:

networks:
  default:
    name: cantera-hub-dev-network
